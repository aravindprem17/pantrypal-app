<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PantryPal - Grocery Inventory</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🛒 PantryPal</h1>
        <div id="auth-status">
            <span id="welcome-message"></span>
            <button id="logout-button" style="display: none;">Logout</button>
        </div>
    </header>

    <main>
        <section id="auth-section">
            <div id="login-form-container">
                <h2>Login</h2>
                <form id="login-form">
                    <input type="text" id="login-username" placeholder="Username" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit">Login</button>
                    <p>Don't have an account? <a href="#" id="show-register">Register here</a></p>
                </form>
            </div>
            <div id="register-form-container" style="display: none;">
                <h2>Register</h2>
                <form id="register-form">
                    <input type="text" id="register-username" placeholder="Username" required>
                    <input type="password" id="register-password" placeholder="Password" required>
                    <button type="submit">Register</button>
                     <p>Already have an account? <a href="#" id="show-login">Login here</a></p>
                </form>
            </div>
            <p id="auth-error" class="error-message"></p>
        </section>

        <section id="inventory-section" style="display: none;">
            <h2>My Pantry</h2>

            <form id="add-item-form">
                <h3>Add New Item</h3>
                <input type="text" id="item-name" placeholder="Item Name" required>
                <input type="text" id="item-category" placeholder="Category (e.g., Produce)">
                <input type="number" id="item-quantity" placeholder="Quantity" step="any" required>
                <input type="text" id="item-unit" placeholder="Unit (e.g., kg, pcs)">
                <label for="item-purchase-date">Purchase Date:</label>
                <input type="date" id="item-purchase-date">
                <label for="item-expiry-date">Expiry Date:</label>
                <input type="date" id="item-expiry-date">
                <input type="number" id="item-low-stock" placeholder="Low Stock Alert Qty" step="any">
                <button type="submit">Add Item</button>
                <p id="add-item-error" class="error-message"></p>
            </form>

            <hr>

            <div class="filters">
                <input type="text" id="search-input" placeholder="Search items...">
                </div>


            <h3>Current Inventory</h3>
            <table id="inventory-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Quantity</th>
                        <th>Unit</th>
                        <th>Expiry Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="inventory-list">
                    </tbody>
            </table>
             <p id="items-error" class="error-message"></p>

            <div id="edit-modal" class="modal">
              <div class="modal-content">
                <span class="close-button">&times;</span>
                <h3>Edit Item</h3>
                <form id="edit-item-form">
                    <input type="hidden" id="edit-item-id">
                    <label for="edit-item-name">Name:</label>
                    <input type="text" id="edit-item-name" required>

                    <label for="edit-item-category">Category:</label>
                    <input type="text" id="edit-item-category">

                    <label for="edit-item-quantity">Quantity:</label>
                    <input type="number" id="edit-item-quantity" step="any" required>

                    <label for="edit-item-unit">Unit:</label>
                    <input type="text" id="edit-item-unit">

                    <label for="edit-item-expiry-date">Expiry Date:</label>
                    <input type="date" id="edit-item-expiry-date">

                     <label for="edit-item-low-stock">Low Stock Alert:</label>
                    <input type="number" id="edit-item-low-stock" step="any">

                    <button type="submit">Save Changes</button>
                </form>
                <p id="edit-item-error" class="error-message"></p>
              </div>
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
